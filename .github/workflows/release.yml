# Builds Windows, Linux and macOS binaries and publishes a GitHub release
# whenever main has a version (internal/version/version.go) that has no release yet.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's/.*Version = "\(.*\)".*/\1/p' internal/version/version.go)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test
        if: steps.ver.outputs.exists != 'true'
        run: go test ./...

      - name: Build
        if: steps.ver.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="buddy-tower_${VERSION}_${os}_${arch}"
            [ "$os" = darwin ] && name="buddy-tower_${VERSION}_macos_${arch}"
            dir="dist/$name"
            mkdir -p "$dir"
            exe=buddy-tower; [ "$os" = windows ] && exe=buddy-tower.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$dir/$exe" .
            cp LICENSE README.md THIRD_PARTY_NOTICES.md "$dir/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.zip *.tar.gz > checksums.txt)

      - name: Publish release
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # notes = this version's section of RELEASE_NOTES.md
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' RELEASE_NOTES.md > notes.md
          gh release create "v$VERSION" dist/*.zip dist/*.tar.gz dist/checksums.txt \
            --title "Buddy Tower $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
